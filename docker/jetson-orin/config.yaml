# The Jetson Orin image's config, at /etc/parakeet-run/config.yaml. Mount your own
# over it, or override any setting with its PARAKEET_RUN_* variable: PARAKEET_RUN_
# followed by the setting's path in upper case, such as PARAKEET_RUN_SERVER_REPLICAS.
# Set PARAKEET_RUN_API_KEY to require a bearer key.
# `docker run ... parakeet-run:jetson-orin config` prints the effective settings.

runtime:
  library: /opt/onnxruntime/lib/libonnxruntime.so
  provider: cuda
  threads: 1
model:
  dir: /var/lib/parakeet-run/assets   # the model bundle; mount a volume here
server:
  listen: :8880
  replicas: 1
